<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatStory Beta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="/">ChatStory</a>
    <nav class="nav"><a href="/dashboard">Dashboard</a><a href="/admin">Admin</a></nav>
  </header>
  <section class="hero">
    <div class="eyebrow">Admin beta · narrative engine</div>
    <h1>Test ChatStory generation</h1>
    <p class="lead">Full LLM story pipeline: parse → stats → chapter writing → illustrations → PDF. Queued like other products.</p>
  </section>

  <section class="grid-2">
    <label class="drop-zone card" id="drop-zone">
      <span>
        <strong id="drop-text">Drop chat export for story book</strong><br>
        <span class="muted">WhatsApp TXT/ZIP, Instagram/Telegram JSON. Runs the legacy orchestrator.</span>
      </span>
      <input type="file" id="file-input" accept=".txt,.json,.zip">
    </label>
    <aside class="card">
      <div class="eyebrow">Pipeline</div>
      <h2>Parser → LLM → PDF</h2>
      <div class="steps">
        <div class="step active"><span>Parse</span><span>01</span></div>
        <div class="step"><span>Story writing</span><span>02</span></div>
        <div class="step"><span>Render book</span><span>03</span></div>
      </div>
      <div id="error-box"></div>
    </aside>
  </section>
</main>
<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const errorBox = document.getElementById('error-box');
const dropText = document.getElementById('drop-text');

['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files.length) upload(e.target.files[0]); });

async function upload(file) {
  errorBox.innerHTML = '';
  dropText.textContent = 'Uploading…';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Upload failed');
    window.location.href = data.status_url;
  } catch (err) {
    errorBox.innerHTML = '<div class="error">' + err.message + '</div>';
    dropText.textContent = 'Drop chat export for story book';
  }
}
</script>
</body>
</html>
