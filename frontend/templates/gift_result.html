<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Engine · ChatStory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="/">ChatStory</a>
    <nav class="nav"><a class="active" href="/gift-engine">Gift Engine</a><a href="/">Home</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Gift results</div>
    <h1>Thoughtful ideas from real signals.</h1>
    <p class="lead" id="summary">Loading recommendations...</p>
  </section>

  <section class="grid-3" id="signal-cards"></section>
  <section class="grid-2" style="margin-top:16px" id="suggestions"></section>
  <div id="error-box"></div>
</main>

<script>
const jobId = "{{ job_id }}";
const sections = [
  ['low_budget', 'Low budget'],
  ['medium_budget', 'Medium budget'],
  ['premium', 'Premium'],
  ['emotional_gifts', 'Emotional gifts'],
  ['experiences', 'Experiences'],
  ['hobby_gifts', 'Hobby gifts'],
  ['stress_relief', 'Stress relief'],
];

fetch(`/api/gift-engine/result/${jobId}`).then(r => {
  if (!r.ok) throw new Error('Gift result is not ready');
  return r.json();
}).then(render).catch(err => {
  document.getElementById('error-box').innerHTML = `<div class="error">${err.message}</div>`;
});

function render(data) {
  const active = Object.entries(data.signals || {}).filter(([, s]) => s.score > 0);
  document.getElementById('summary').textContent = active.length
    ? `${active.length} signal groups detected across ${data.detected_format} messages.`
    : 'No strong gift signals were detected in this export.';
  document.getElementById('signal-cards').innerHTML = active.slice(0, 6).map(([name, signal]) => `
    <div class="stat">
      <div class="num">${signal.score}</div>
      <div class="label">${name.replace('_', ' ')}</div>
      <div class="chip-row">${(signal.top_keywords || []).slice(0, 4).map(([k]) => `<span class="chip">${k}</span>`).join('')}</div>
    </div>
  `).join('') || '<div class="card"><h2>No strong signals</h2><p class="muted">Try a longer export or a chat with more everyday preference details.</p></div>';

  document.getElementById('suggestions').innerHTML = sections.map(([key, title]) => {
    const ideas = (data.suggestions && data.suggestions[key]) || [];
    return `<div class="card"><div class="eyebrow">${title}</div><h2>${ideas.length ? ideas[0].category.replace('_', ' ') : 'No match yet'}</h2>
      <div class="steps">${ideas.map(idea => `<div class="step done"><span><strong>${idea.title}</strong><br><span class="muted">${idea.reason}</span></span><span>${label(idea.budget)}</span></div>`).join('') || '<p class="muted">No recommendation crossed the rule threshold.</p>'}</div>
    </div>`;
  }).join('');
}

function label(value) {
  return (value || '').replace('_', ' ');
}
</script>
</body>
</html>
