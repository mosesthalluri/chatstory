<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing · {{ product.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="/">ChatStory</a>
    <nav class="nav"><a href="/{{ product_slug }}" class="active">{{ product.title }}</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Processing</div>
    <h1 id="title">Reading the signal.</h1>
    <p class="lead" id="message">Your export is moving through the parser-first pipeline.</p>
  </section>

  <section class="grid-2">
    <div class="card">
      <div class="label">Progress</div>
      <div class="progress" style="margin:18px 0 10px"><span id="bar"></span></div>
      <div class="muted" id="pct">0%</div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Insight preview</div>
      <h2 id="preview-title">Preparing analysis</h2>
      <p class="muted" id="preview-copy">The dashboard will unlock as soon as processing finishes.</p>
      <div id="actions" class="chip-row"></div>
      <div id="error-box"></div>
    </div>
  </section>
</main>

<script>
const jobId = "{{ job_id }}";
const productSlug = "{{ product_slug }}";
const apiStatus = "{{ product.api_status }}/" + jobId;
const resultUrl = "{{ product.result_path }}/" + jobId;
const unlockUrl = `/unlock/${productSlug}/${jobId}`;
const states = {
  queued: 'Waiting in queue',
  processing: 'Starting your export',
  parsing: 'Reading your conversations',
  analyzing: 'Finding your shared patterns',
  generating_wrapped: 'Crafting your wrapped story',
  generating_gifts: 'Finding meaningful gifts',
  generating_story: 'Writing your narrative',
  rendering: 'Building your cinematic export',
  done: 'Dashboard ready',
  failed: 'Processing stopped',
  error: 'Processing stopped'
};
let timer = null;

async function poll() {
  try {
    const resp = await fetch(apiStatus);
    const data = await resp.json();
    render(data);
    if (data.state === 'done' || data.state === 'failed' || data.state === 'error') clearInterval(timer);
  } catch (err) {
    document.getElementById('error-box').innerHTML = `<div class="error">${err.message}</div>`;
  }
}

function render(s) {
  const progress = s.progress || 0;
  document.getElementById('title').textContent = states[s.state] || s.state;
  document.getElementById('message').textContent = emotionalMessage(s.state, s.message);
  document.getElementById('bar').style.width = progress + '%';
  document.getElementById('pct').textContent = progress + '%';
  renderSteps(s.phases || fallbackSteps(s.state));
  renderPreview(s);
}

function emotionalMessage(state, fallback) {
  return ({
    parsing: 'Cleaning the export and preserving only the signals that matter.',
    analyzing: 'Detecting late-night moments, recurring rituals, and emotional fingerprints.',
    rendering: 'Turning the strongest patterns into something worth opening.',
    done: 'Your teaser is ready. Premium details unlock after verification.'
  })[state] || fallback || '';
}

function fallbackSteps(state) {
  const names = ['Parse export', 'Compute signals', 'Render result'];
  const done = state === 'done' ? 3 : state === 'rendering' ? 2 : state === 'analyzing' ? 1 : 0;
  return names.map((name, i) => ({ name, status: i < done ? 'done' : i === done ? 'in_progress' : 'pending' }));
}

function renderSteps(steps) {
  document.getElementById('steps').innerHTML = steps.map(step =>
    `<div class="step ${step.status === 'in_progress' ? 'active' : step.status}">
      <span>${step.name}</span><span>${step.status === 'done' ? 'Done' : step.status === 'in_progress' ? 'Now' : 'Next'}</span>
    </div>`
  ).join('');
}

function renderPreview(s) {
  if (s.state === 'done') {
    document.getElementById('preview-title').textContent = 'Your result is ready';
    if (s.unlocked && s.download_links && s.download_links.pdf) {
      document.getElementById('preview-copy').textContent = 'Payment verified — download your PDF or open the full view.';
      document.getElementById('actions').innerHTML = `<a class="btn primary" href="${s.download_links.pdf}">Download PDF</a><a class="btn secondary" href="${resultUrl}">Open view</a>`;
    } else {
      document.getElementById('preview-copy').textContent = 'Teaser is live. Unlock via Paytm, wait for admin verification, then download from the unlock page or dashboard.';
      document.getElementById('actions').innerHTML = `<a class="btn primary" href="${resultUrl}">Open teaser</a><a class="btn secondary" href="${unlockUrl}">Unlock & download</a>`;
    }
  } else if (s.state === 'failed' || s.state === 'error') {
    document.getElementById('preview-title').textContent = 'We could not finish this export';
    document.getElementById('preview-copy').textContent = s.error || 'Try another export or a smaller date range.';
    document.getElementById('error-box').innerHTML = `<div class="error">${s.error || 'Unknown error'}</div>`;
  } else if (s.stats) {
    document.getElementById('preview-title').textContent = `${(s.stats.total_messages || 0).toLocaleString()} messages detected`;
    document.getElementById('preview-copy').textContent = 'The dashboard is being assembled with the signals found so far.';
  }
}

poll();
timer = setInterval(poll, 1800);
</script>
</body>
</html>
