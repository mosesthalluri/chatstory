<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing · ChatStory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="/">ChatStory</a>
    <nav class="nav"><a href="/">Home</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Processing</div>
    <h1 id="title">Building your result.</h1>
    <p class="lead" id="message">Your export is moving through the pipeline.</p>
  </section>

  <section class="grid-2">
    <div class="card">
      <div class="label">Progress</div>
      <div class="progress" style="margin:18px 0 10px"><span id="bar"></span></div>
      <div class="muted" id="pct">0%</div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Result</div>
      <h2 id="result-title">Waiting for completion</h2>
      <p class="muted" id="result-copy">Actions will appear when the job is ready.</p>
      <div class="chip-row" id="actions"></div>
      <div id="error-box"></div>
    </div>
  </section>
</main>

<script>
const jobId = "{{ job_id }}";
const currency = "{{ currency }}";
const price = "{{ price }}";
let timer = null;

async function poll() {
  const resp = await fetch(`/api/status/${jobId}`);
  const data = await resp.json();
  render(data);
  if (data.state === 'done' || data.state === 'error') clearInterval(timer);
}

function render(s) {
  document.getElementById('title').textContent = s.state === 'done' ? 'Your PDF is ready.' : stateTitle(s.state);
  document.getElementById('message').textContent = s.message || '';
  document.getElementById('bar').style.width = (s.progress || 0) + '%';
  document.getElementById('pct').textContent = (s.progress || 0) + '%';
  document.getElementById('steps').innerHTML = (s.phases || []).map(p =>
    `<div class="step ${p.status === 'in_progress' ? 'active' : p.status}"><span>${p.name}</span><span>${p.status}</span></div>`
  ).join('');
  if (s.state === 'done') {
    document.getElementById('result-title').textContent = 'Export complete';
    document.getElementById('result-copy').textContent = 'Open the preview or unlock the full PDF.';
    document.getElementById('actions').innerHTML = `<a class="btn secondary" href="/preview/${jobId}">Open preview</a><button class="btn primary" onclick="pay()">Unlock ${currency}${price}</button>`;
  }
  if (s.state === 'error') {
    document.getElementById('error-box').innerHTML = `<div class="error">${s.error || 'Unknown error'}</div>`;
  }
}
function stateTitle(state) {
  return ({queued:'Queued', parsing:'Parsing export', analyzing:'Computing signals', writing:'Writing', rendering:'Rendering PDF', error:'Something stopped'})[state] || state;
}
async function pay() {
  const resp = await fetch(`/api/pay/${jobId}`, {method:'POST'});
  if (resp.ok) window.location.href = `/full/${jobId}`;
}
poll();
timer = setInterval(poll, 2500);
</script>
</body>
</html>
